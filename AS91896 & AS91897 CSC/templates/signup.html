<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>
<body>
    <h1>Create an Account</h1>
    
    <!-- The form sends a POST request to the /signup route in app.py -->
    <form method="POST">
        <label>I am a:</label><br>
        <select name="account_type" required>
            <option value="user">Customer (Looking for deals)</option>
            <option value="bakery">Bakery (Selling unsold items)</option>
        </select>
        <br><br>
        
        <label>Name (or Bakery Name):</label><br>
        <input type="text" name="name" required>
        <br><br>
        
        <label>Email Address:</label><br>
        <input type="email" name="email" required>
        <br><br>
        
        <button type="submit">Sign Up</button>
    </form>
    
    <br>
    <a href="/">Back to Home</a>
</body>
</html>
